# Windows and Android are built locally and attached to releases by hand, so
# CI only covers the platforms that cannot be built on the dev machine.
name: Build Linux / macOS / iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar release
        run: tar -czf FusionReader-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: FusionReader-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/fusion_reader.app" FusionReader-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: FusionReader-macos.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned build — sideload with AltStore/TrollStore or sign with your own certificate.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FusionReader-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: FusionReader-ios-unsigned.ipa
