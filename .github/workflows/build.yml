# Windows is built locally and attached to releases by hand; CI covers the
# rest. Android APKs are signed with the shared debug keystore from the
# ANDROID_DEBUG_KEYSTORE_B64 secret so upgrades keep the same signature.
name: Build Linux / macOS / iOS / Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Tag builds attach their artifacts straight to the release, so nothing has
# to round-trip through the dev machine's connection.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore shared debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d ' \r')
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/FusionReader-$VERSION-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar release
        run: tar -czf FusionReader-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: FusionReader-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" FusionReader-linux-x64.tar.gz --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test Apple runtime with AOT compilation
        timeout-minutes: 15
        run: flutter drive --profile -d macos --target integration_test/extension_runtime_test.dart --driver test_driver/extension_runtime_test.dart --no-pub
      - name: Test history and bundled serif font
        timeout-minutes: 10
        run: flutter drive --profile -d macos --target integration_test/history_font_test.dart --driver test_driver/extension_runtime_test.dart --no-pub
      - run: flutter build macos --release
      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/fusion_reader.app" FusionReader-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: FusionReader-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" FusionReader-macos.zip --clobber

  ios:
    uses: ./.github/workflows/ios.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
