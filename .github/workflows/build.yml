# Windows is built locally and attached to releases by hand; CI covers the
# rest. Android APKs are signed with the shared debug keystore from the
# ANDROID_DEBUG_KEYSTORE_B64 secret so upgrades keep the same signature.
name: Build Linux / macOS / iOS / Android

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to build'
        type: choice
        options: [all, android]
        default: all
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Tag builds attach their artifacts straight to the release, so nothing has
# to round-trip through the dev machine's connection.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify fixed Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo '::error::ANDROID_DEBUG_KEYSTORE_B64 is required. Refusing to generate a temporary signing key.'
            exit 1
          fi
          umask 077
          KEY_FILE="$RUNNER_TEMP/fusion-reader-signing.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEY_FILE"
          keytool -exportcert -alias androiddebugkey -keystore "$KEY_FILE" \
            -storepass android -file "$RUNNER_TEMP/fusion-reader-signing.cer"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/fusion-reader-signing.cer" | cut -d' ' -f1)
          EXPECTED=$(tr -d '\r\n' < android/signing-certificate.sha256)
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::The signing key does not match the pinned certificate. Refusing to publish an incompatible update.'
            exit 1
          fi
          echo "FUSION_ANDROID_KEYSTORE=$KEY_FILE" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test APK publication checks
        run: python3 -m unittest discover -s test -p android_signing_test.py
      - name: Test library backup and history
        run: flutter test --no-pub test/library_backup_test.dart test/history_test.dart
      - run: flutter build apk --release --split-per-abi
      - name: Verify final APK signatures and versions
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          python3 scripts/verify_android_apks.py --build-tools "$BUILD_TOOLS"
      - uses: actions/upload-artifact@v4
        with:
          name: android-signature-verification
          path: build/verification/android-signatures.json
      - name: Rename APKs
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d ' \r')
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/FusionReader-$VERSION-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar release
        run: tar -czf FusionReader-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: FusionReader-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" FusionReader-linux-x64.tar.gz --clobber

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test Apple runtime with AOT compilation
        timeout-minutes: 15
        run: flutter drive --profile -d macos --target integration_test/extension_runtime_test.dart --driver test_driver/extension_runtime_test.dart --no-pub
      - name: Test history and bundled serif font
        timeout-minutes: 10
        run: flutter drive --profile -d macos --target integration_test/history_font_test.dart --driver test_driver/extension_runtime_test.dart --no-pub
      - name: Test library import and export
        timeout-minutes: 10
        run: flutter drive --profile -d macos --target integration_test/library_transfer_test.dart --driver test_driver/extension_runtime_test.dart --no-pub
      - run: flutter build macos --release
      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/fusion_reader.app" FusionReader-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: FusionReader-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" FusionReader-macos.zip --clobber

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    uses: ./.github/workflows/ios.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
