name: Test account sync service

on:
  push:
    branches: [main]
    paths: ['server/**', 'lib/services/account_*.dart', 'lib/services/library_backup.dart', 'lib/models/**', 'lib/pages/account_page.dart', 'test/account_*.dart', '.github/workflows/sync-tests.yml']
  pull_request:
    paths: ['server/**', 'lib/services/account_*.dart', 'lib/services/library_backup.dart', 'lib/models/**', 'lib/pages/account_page.dart', 'test/account_*.dart', '.github/workflows/sync-tests.yml']

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: python -m unittest discover -s server -p 'test_*.py' -v
      - run: python -m pip install -r server/requirements.txt
      - name: Validate production server configuration
        env:
          FUSION_SYNC_DB: ${{ runner.temp }}/fusion-sync-config.sqlite3
        run: gunicorn --check-config --chdir server --workers 1 --threads 2 --worker-class gthread 'sync_server:create_app()'
      - run: flutter pub get
      - run: flutter test --no-pub test/account_backend_test.dart test/account_service_test.dart test/account_api_test.dart test/account_page_test.dart test/library_backup_test.dart
