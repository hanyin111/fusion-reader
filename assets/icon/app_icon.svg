<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7CFF"/>
      <stop offset="0.55" stop-color="#B36CE8"/>
      <stop offset="1" stop-color="#F07BC0"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F79FF"/>
      <stop offset="1" stop-color="#2A1B7E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <!-- sparkles -->
  <path d="M96 118 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 Z" fill="#FFF" opacity="0.9"/>
  <path d="M420 92 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z" fill="#FFF" opacity="0.75"/>
  <path d="M432 296 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#FFF" opacity="0.6"/>
  <circle cx="78" cy="320" r="6" fill="#FFF" opacity="0.5"/>

  <!-- hair dome (behind face) -->
  <ellipse cx="256" cy="212" rx="152" ry="138" fill="#5A48D6"/>
