  <path d="M196 180 Q230 164 268 170" fill="none" stroke="#7A6AE8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- book cover -->
  <path d="M256 396 C208 372 164 366 124 372 L124 462 C166 456 212 462 256 484
