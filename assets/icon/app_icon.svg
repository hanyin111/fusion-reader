  <!-- pages -->
  <path d="M256 402 C214 380 176 374 140 380 L140 452 C176 446 216 452 256 470 Z" fill="#FFFFFF"/>
  <path d="M256 402 C298 380 336 374 372 380 L372 452 C336 446 296 452 256 470 Z" fill="#FDF6FF"/>
  <!-- page lines -->
  <path d="M158 398 C186 394 214 398 240 408 M158 420 C186 416 214 420 240 430" fill="none" stroke="#D8CFF5" stroke-width="5" stroke-linecap="round"/>
  <path d="M354 398 C326 394 298 398 272 408 M354 420 C326 416 298 420 272 430" fill="none" stroke="#E7D9F2" stroke-width="5" stroke-linecap="round"/>
  <!-- spine -->
  <path d="M256 402 L256 470" stroke="#C9B8F0" stroke-width="4"/>

  <!-- hands on the book edges -->
  <circle cx="136" cy="404" r="17" fill="#FFE9DB"/>
  <circle cx="376" cy="404" r="17" fill="#FFE9DB"/>
</svg>
