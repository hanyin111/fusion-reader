  <!-- blush -->
  <ellipse cx="172" cy="330" rx="19" ry="11" fill="#FF9FB6" opacity="0.55"/>
  <ellipse cx="340" cy="330" rx="19" ry="11" fill="#FF9FB6" opacity="0.55"/>

  <!-- eyes -->
  <ellipse cx="206" cy="308" rx="27" ry="34" fill="#FFFFFF"/>
  <ellipse cx="306" cy="308" rx="27" ry="34" fill="#FFFFFF"/>
  <ellipse cx="206" cy="310" rx="20" ry="30" fill="url(#iris)"/>
  <ellipse cx="306" cy="310" rx="20" ry="30" fill="url(#iris)"/>
  <ellipse cx="206" cy="314" rx="9" ry="14" fill="#180F45"/>
  <ellipse cx="306" cy="314" rx="9" ry="14" fill="#180F45"/>
  <circle cx="199" cy="298" r="7" fill="#FFF" opacity="0.95"/>
  <circle cx="299" cy="298" r="7" fill="#FFF" opacity="0.95"/>
  <circle cx="213" cy="326" r="3.5" fill="#FFF" opacity="0.8"/>
  <circle cx="313" cy="326" r="3.5" fill="#FFF" opacity="0.8"/>
  <!-- upper lashes -->
  <path d="M177 284 Q206 264 235 282 L233 292 Q206 276 181 294 Z" fill="#2E2258"/>
  <path d="M277 282 Q306 264 335 284 L331 294 Q306 276 279 292 Z" fill="#2E2258"/>
  <!-- brows -->
  <path d="M184 258 Q206 248 228 256" fill="none" stroke="#4B3AC0" stroke-width="6" stroke-linecap="round"/>
  <path d="M284 256 Q306 248 328 258" fill="none" stroke="#4B3AC0" stroke-width="6" stroke-linecap="round"/>

  <!-- mouth -->
  <path d="M243 346 Q256 368 269 346 Z" fill="#F2708A"/>

  <!-- bangs -->
