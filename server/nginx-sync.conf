# Enable only after issuing this host's certificate with Certbot webroot.
# When protecting an origin behind Cloudflare, obtain its current official
# IPv4/IPv6 CIDRs and trust CF-Connecting-IP only from those ranges.
# Check the edge allowlist against $realip_remote_addr (original peer), never
# the restored visitor $remote_addr. Allow loopback for local checks, reject
# other direct peers, and keep X-Real-IP below set to the restored $remote_addr.
# Apply the rules only to this site's servers, after enabling the DNS proxy.
server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fusion-reader-acme;
    }
    location / {
        return 308 https://sync.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sync.example.com;
    ssl_certificate /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FusionSyncTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log off;
    client_max_body_size 21m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_set_header Host sync.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
    }
}
